services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: rcis
      POSTGRES_PASSWORD: rcis_dev
      POSTGRES_DB: rcis
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rcis_admin
      MINIO_ROOT_PASSWORD: rcis_dev_password
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Web console
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata: